name: 365-Day Shorts Auto Pipeline

on:
  schedule:
    # 매일 KST 09:00 (UTC 00:00) 실행
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '오늘의 Shorts 주제 (비워두면 자동 선택)'
        required: false
        default: ''
      dry_run:
        description: '실제 업로드 없이 테스트만 실행'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  create-and-upload:
    name: Shorts 제작 및 업로드
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 의존성 설치
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: FFmpeg 설치
        run: sudo apt-get install -y ffmpeg

      - name: Shorts 제작 및 업로드
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python scripts/demo_pipeline.py

      - name: 업로드 결과 아티팩트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            scripts/output/
            scripts/pipeline.log
          retention-days: 7

  notify-failure:
    name: 실패 알림
    runs-on: ubuntu-latest
    needs: create-and-upload
    if: failure()
    steps:
      - name: 실패 이슈 생성
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Pipeline] Shorts 업로드 실패 - Run #${context.runNumber}`,
              body: `## 파이프라인 실패\n\n- **Run**: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n- **날짜**: ${new Date().toLocaleDateString('ko-KR')}\n\n로그를 확인하고 재실행하세요.`,
              labels: ['pipeline-failure']
            })
